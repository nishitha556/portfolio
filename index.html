<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nishitha | Portfolio</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #070b14;
            color: #f5f7ff;
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Background glow */
        body::before {
            content: "";
            position: fixed;
            width: 500px;
            height: 500px;
            background: #4f46e5;
            opacity: 0.12;
            filter: blur(150px);
            top: -150px;
            left: -150px;
            pointer-events: none;
        }

        body::after {
            content: "";
            position: fixed;
            width: 450px;
            height: 450px;
            background: #06b6d4;
            opacity: 0.08;
            filter: blur(150px);
            right: -150px;
            bottom: -150px;
            pointer-events: none;
        }

        /* Navigation */
        nav {
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
            background: rgba(7, 11, 20, 0.8);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -1px;
        }

        .logo span {
            color: #818cf8;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 30px;
        }

        nav a {
            color: #aeb6c8;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: 0.3s ease;
        }

        nav a:hover {
            color: #ffffff;
            text-shadow: 0 0 12px rgba(129, 140, 248, 0.8);
        }

        /* Hero */
        .hero {
            min-height: 90vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 80px 20px;
            position: relative;
        }

        .hero-content {
            max-width: 850px;
        }

        .small-title {
            color: #818cf8;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        .hero h1 {
            font-size: clamp(48px, 8vw, 82px);
            line-height: 1.05;
            letter-spacing: -4px;
            margin-bottom: 25px;
        }

        .hero h1 span {
            background: linear-gradient(90deg, #818cf8, #22d3ee);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            color: #9ca7ba;
            font-size: 19px;
            max-width: 650px;
            margin: auto;
        }

        .hero-buttons {
            margin-top: 35px;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;
            padding: 13px 25px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: 0.3s ease;
        }

        .primary-btn {
            background: #6366f1;
            color: white;
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.25);
        }

        .secondary-btn {
            border: 1px solid #30384c;
            color: #d8deeb;
            background: rgba(255, 255, 255, 0.03);
        }

        .btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 0 25px rgba(99, 102, 241, 0.45);
        }

        /* Sections */
        section {
            max-width: 1050px;
            margin: auto;
            padding: 90px 25px;
        }

        .section-heading {
            margin-bottom: 45px;
        }

        .section-heading small {
            color: #818cf8;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
